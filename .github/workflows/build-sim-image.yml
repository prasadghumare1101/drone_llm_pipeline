name: Build & publish full-sim image

# Builds the all-in-one PX4 + ROS 2 + Gazebo + dashboard image and pushes it to
# GHCR, so anyone can `docker pull` it instead of building locally.
#
# Run it from the Actions tab (workflow_dispatch), or automatically on a version
# tag (v*). The image lands at:
#   ghcr.io/<owner>/drone-llm-sim:latest

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: write        # needed to push to GHCR

    steps:
      # The sim image is large (~8-10 GB) and PX4 compiles from source; free the
      # runner's disk first or the build runs out of space.
      - name: Free up disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: false

      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute lowercase image name
        id: img
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/drone-llm-sim" >> "$GITHUB_OUTPUT"

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.sim
          push: true
          tags: |
            ${{ steps.img.outputs.name }}:latest
            ${{ steps.img.outputs.name }}:${{ github.sha }}
          provenance: false
