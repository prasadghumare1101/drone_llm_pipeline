# Serve the built AEGIS dashboard as a single-page app.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: any route that is not a real file returns index.html so
    # client-side routing works on refresh/deep-link.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Long-cache the hashed build assets (their names change on every build).
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
